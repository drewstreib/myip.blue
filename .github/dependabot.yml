# Keeps everything this repo pins moving: the workflow's action SHAs, the
# Dockerfile's two base-image digests (the golang one is how Go point releases
# reach the binary) and the Go module requirements.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
